# Self-host everything: the API, the website and Postgres.
#   cp api/.env.example api/.env   # add ANTHROPIC_API_KEY (optional) and any other keys
#   docker compose up --build
# Then open http://localhost:3001. Self-hosted audits have no daily limits.
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: seogeo
      POSTGRES_PASSWORD: seogeo
      POSTGRES_DB: seogeo
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seogeo"]
      interval: 2s
      retries: 20

  api:
    build: ./api
    env_file: api/.env  # create it first: cp api/.env.example api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://seogeo:seogeo@postgres:5432/seogeo
      CORS_ORIGINS: http://localhost:3001
      FREE_AUDITS_PER_DAY: "0"  # public-demo limits off when self-hosting
      DAILY_BUDGET_USD: "0"
    ports: ["8001:8001"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
        NEXT_PUBLIC_SITE_URL: http://localhost:3001
    ports: ["3001:3000"]
    depends_on: [api]

volumes:
  pgdata:
