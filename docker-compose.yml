# Local Postgres + Redis for when the in-memory store is swapped out. Start Docker Desktop, then:
#   docker compose up -d
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: seogeo
      POSTGRES_PASSWORD: seogeo
      POSTGRES_DB: seogeo
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7.4
    ports: ["6380:6379"]
volumes:
  pgdata:
