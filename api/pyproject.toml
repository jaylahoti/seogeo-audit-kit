[project]
name = "templatescope-api"
version = "0.1.0"
description = "Per-template SEO and AI-readiness audits for programmatic SEO sites"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "anthropic>=0.40",
    "selectolax>=1.0.2",
    "datasketch>=2.0.0",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
